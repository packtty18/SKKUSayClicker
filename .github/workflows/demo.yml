name: Unity WebGL Build & Deploy

on:
  push:
    branches: [ web_build ]
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 (KST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. 변경사항 및 브랜치 확인
  check-changes:
    name: Check Changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      target_branch: ${{ steps.check.outputs.target_branch }}
      last_commit: ${{ steps.check.outputs.last_commit }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - id: check
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            git fetch origin main
            git checkout main
            COMMITS=$(git log --since="24 hours ago" --oneline | wc -l)
            if [ "$COMMITS" -gt 0 ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "target_branch=main" >> $GITHUB_OUTPUT
              echo "last_commit=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "target_branch=web_build" >> $GITHUB_OUTPUT
            echo "last_commit=${{ github.event.head_commit.message }}" >> $GITHUB_OUTPUT
          fi

  # 2. 빌드 (실패 시 Gemini 분석)
  build:
    name: Build WebGL
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.target_branch }}
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**','Packages/**','ProjectSettings/**') }}

      - name: Unity Build
        id: unity_build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL

      # [빌드 실패 처리]
      - name: Analyze Build Error with Gemini
        if: failure()
        run: |
          LOG_FILE=$(find /home/runner -name "Editor.log" -o -name "*.log" | grep "Unity" | head -1)
          [ -n "$LOG_FILE" ] && tail -n 500 "$LOG_FILE" > build_error.log || echo "Log not found" > build_error.log
          
          LOG_CONTENT=$(cat build_error.log | jq -R -s '.')
          JSON=$(jq -n --argjson log "$LOG_CONTENT" '{contents: [{parts: [{text: ("Unity WebGL 빌드 실패 로그입니다. 원인과 해결방법을 분석해주세요.\n\n" + $log)}]}]}')
          
          RES=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${{ secrets.GEMINI_API }}" \
            -H "Content-Type: application/json" -d "$JSON")
            
          ANALYSIS=$(echo "$RES" | jq -r '.candidates[0].content.parts[0].text // "분석 실패"')
          
          echo "GEMINI_BUILD_ANALYSIS<<EOF" >> $GITHUB_ENV
          echo "$ANALYSIS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Slack Build Failure
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ WebGL 빌드 실패",
              "blocks": [
                { "type": "section", "text": { "type": "mrkdwn", "text": "🔥 *빌드 실패* (${{ needs.check-changes.outputs.target_branch }})" } },
                { "type": "divider" },
                { "type": "section", "text": { "type": "mrkdwn", "text": "*🤖 Gemini 빌드 분석:*\n${{ env.GEMINI_BUILD_ANALYSIS }}" } }
              ]
            }

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: webgl-build
          path: build/WebGL

  # 3. 배포 (빌드 성공 시 실행, 배포 실패 시 Gemini 분석)
  deploy:
    name: Deploy to itch.io
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webgl-build
          path: build/WebGL

      - name: Butler Push
        id: butler_push
        uses: itchio/butler-action@v1.0.3
        with:
          api-key: ${{ secrets.ITCH_IO_API }}
          user: skkupsh
          game: card-factory
          channel: html5
          version: ${{ github.run_number }}
          directory: build/WebGL

      # [배포 실패 처리]
      - name: Analyze Deploy Error with Gemini
        if: failure()
        run: |
          # 배포 로그는 직접 캡처가 어려우므로 일반적인 가이드를 요청
          JSON=$(jq -n '{
            contents: [{
              parts: [{
                text: "itch.io Butler 배포(Deploy)가 실패했습니다. 로그 파일 접근이 불가능한 상태입니다. Butler Push 실패의 가장 일반적인 원인 3가지(예: API Key, 버전 충돌 등)와 해결 방법을 요약해서 알려주세요."
              }]
            }]
          }')

          RES=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${{ secrets.GEMINI_API }}" \
            -H "Content-Type: application/json" -d "$JSON")
            
          ANALYSIS=$(echo "$RES" | jq -r '.candidates[0].content.parts[0].text // "분석 실패"')
          
          echo "GEMINI_DEPLOY_ANALYSIS<<EOF" >> $GITHUB_ENV
          echo "$ANALYSIS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Slack Deploy Failure
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ itch.io 배포 실패",
              "blocks": [
                { "type": "section", "text": { "type": "mrkdwn", "text": "🚀 *배포 실패*\nitch.io 업로드 중 오류가 발생했습니다." } },
                { "type": "divider" },
                { "type": "section", "text": { "type": "mrkdwn", "text": "*🤖 Gemini 배포 분석 가이드:*\n${{ env.GEMINI_DEPLOY_ANALYSIS }}" } }
              ]
            }

      # [배포 성공 처리]
      - name: Slack Deploy Success
        if: success()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ 배포 완료",
              "blocks": [
                { "type": "section", "text": { "type": "mrkdwn", "text": "🎉 *배포 성공*\n브랜치: ${{ github.ref_name }}" } }
              ]
            }