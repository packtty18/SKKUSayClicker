name: Unity WebGL Build & Deploy

on:
  push:
    branches: [ web_build ]
  schedule:
    - cron: "0 0 * * *" # 매일 UTC 0시 = 한국시간 오전 9시
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      last_commit_message: ${{ steps.check.outputs.last_commit_message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if build is needed
        id: check
        run: |
          # Push 이벤트면 항상 빌드
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "last_commit_message=${{ github.event.head_commit.message }}" >> $GITHUB_OUTPUT
            echo "✅ Push event - build triggered"
            exit 0
          fi
          
          # 수동 실행이면 항상 빌드
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "last_commit_message=Manual build triggered" >> $GITHUB_OUTPUT
            echo "✅ Manual trigger - build triggered"
            exit 0
          fi
          
          # 스케줄 실행인 경우 - main 브랜치 체크
          git fetch origin main
          git checkout main
          
          # 지난 24시간 이내 커밋이 있는지 확인
          COMMITS_LAST_24H=$(git log --since="24 hours ago" --oneline | wc -l)
          LAST_COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          
          if [ $COMMITS_LAST_24H -gt 0 ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "last_commit_message=$LAST_COMMIT_MSG" >> $GITHUB_OUTPUT
            echo "✅ Found $COMMITS_LAST_24H commits in last 24 hours - build triggered"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "last_commit_message=No changes" >> $GITHUB_OUTPUT
            echo "ℹ️ No commits in last 24 hours - build skipped"
          fi

  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'

    steps:
      # 0. 디스크 공간 확보
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
          fetch-depth: 0

      # 2. 이전 빌드 성공 커밋 찾기
      - name: Get Previous Successful Build Commit
        id: previous_commit
        run: |
          PREVIOUS_COMMIT=$(git log --pretty=format:"%H" --skip=1 -n 20 | while read commit; do
            STATUS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${commit}/status" | \
              jq -r '.state')
            
            if [ "$STATUS" = "success" ]; then
              echo "$commit"
              break
            fi
          done)
          
          if [ -z "$PREVIOUS_COMMIT" ]; then
            PREVIOUS_COMMIT=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          
          echo "previous_sha=$PREVIOUS_COMMIT" >> $GITHUB_OUTPUT

      # 3. 커밋 내역 생성
      - name: Generate Commit History
        id: commits
        run: |
          PREVIOUS_SHA="${{ steps.previous_commit.outputs.previous_sha }}"
          CURRENT_SHA="${{ github.sha }}"
          
          COMMITS=$(git log --pretty=format:"• %s (%an)" ${PREVIOUS_SHA}..${CURRENT_SHA} | head -n 10)
          
          echo "commit_list<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          COMMIT_COUNT=$(git rev-list --count ${PREVIOUS_SHA}..${CURRENT_SHA})
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT

      # 4. Library 캐시
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # 5. Unity WebGL 빌드
      - name: Build WebGL
        id: unity_build
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildProfile: "Assets/Settings/Build Profiles/Web-Mobile-Development.asset"

      # 6. 빌드 로그 저장 (실패 시)
      - name: Save Build Log
        if: failure()
        id: save_log
        run: |
          LOG_FILE=$(find /home/runner/work -name "*.log" -type f | grep -i unity | head -1)
          if [ -n "$LOG_FILE" ]; then
            # 에러는 주로 끝에 있으므로 마지막 500줄만 저장
            tail -n 500 "$LOG_FILE" > build_error.log
            echo "log_saved=true" >> $GITHUB_OUTPUT
          else
            echo "Build failed but log file not accessible" > build_error.log
            echo "log_saved=false" >> $GITHUB_OUTPUT
          fi

      # 7. Gemini API로 로그 분석 (수정됨)
      - name: Analyze Build Error with Gemini
        if: failure()
        id: analyze_error
        run: |
          # 1. 로그 파일 확인
          if [ -f "build_error.log" ]; then
            LOG_CONTENT=$(cat build_error.log)
          else
            LOG_CONTENT="Log file not found."
          fi
          
          # 2. JSON 페이로드 생성 (jq 사용)
          JSON_PAYLOAD=$(jq -n \
            --arg log "$LOG_CONTENT" \
            '{
              contents: [{
                parts: [{
                  text: ("다음은 Unity WebGL 빌드 실패 로그입니다. 이 로그를 분석하여 다음 형식으로 간결하게 답변해주세요:\n\n**원인:**\n(빌드 실패의 주요 원인을 1-2문장으로 설명)\n\n**해결방법:**\n1. (구체적인 해결 방법)\n2. (추가 해결 방법이 있다면)\n\n로그:\n```\n" + $log + "\n```")
                }]
              }],
              generationConfig: {
                temperature: 0.7,
                maxOutputTokens: 1024
              }
            }')
          
          # 3. API 호출 (v1beta 사용 권장 & HTTP 상태 코드 분리)
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${{ secrets.GEMINI_API }}" \
            -H 'Content-Type: application/json' \
            -d "$JSON_PAYLOAD")
          
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)
          
          echo "Debug - HTTP Status: $HTTP_STATUS"
          
          # 4. 결과 파싱 (에러 처리 강화)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            # jq 파싱을 시도하고, 실패하면 에러 메시지 저장 (|| true로 스크립트 중단 방지)
            ANALYSIS=$(echo "$HTTP_BODY" | jq -r '.candidates[0].content.parts[0].text' 2>/dev/null || echo "⚠️ JSON 파싱 오류 발생")
          else
            # API 에러 발생 시 본문 내용 일부 출력
            ERROR_MSG=$(echo "$HTTP_BODY" | head -n 1) # 너무 길 수 있으므로 첫 줄만
            ANALYSIS="⚠️ Gemini API 오류 (HTTP $HTTP_STATUS): $ERROR_MSG"
          fi
          
          # 5. 결과값이 비어있을 경우 대비
          if [ -z "$ANALYSIS" ] || [ "$ANALYSIS" = "null" ]; then
            ANALYSIS="⚠️ 분석 결과를 가져올 수 없습니다. (로그 확인 필요)"
          fi
          
          # 6. Github Output에 저장 (멀티라인 처리)
          echo "analysis<<EOF" >> $GITHUB_OUTPUT
          echo "$ANALYSIS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 8. 빌드 결과물 업로드 (성공 시)
      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL

      # 9. GitHub Pages 배포 준비
      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v5

      # 10. Pages용 Artifact 업로드
      - name: Upload Pages Artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

      # 11. GitHub Pages 배포
      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4

      # 12. 성공 알림 (GitHub Pages 링크 포함)
      - name: Slack Notification (Success)
        if: success()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ WebGL 빌드 성공",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *${{ github.repository }}* WebGL 빌드 완료\n🚀 빌드 유형: ${{ github.event_name == 'schedule' && '스케줄 빌드 (자동)' || github.event_name == 'workflow_dispatch' && '수동 빌드' || 'Push 빌드' }}\n🌿 브랜치: `${{ github.ref_name }}`\n👤 작성자: ${{ github.actor }}\n🌐 <${{ steps.deployment.outputs.page_url }}|GitHub Pages에서 플레이하기>"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "📝 *변경사항* (${{ steps.commits.outputs.commit_count }}개 커밋)\n${{ steps.commits.outputs.commit_list }}"
                  }
                }
              ]
            }

      # 13. 실패 알림 (Gemini 분석 포함)
      - name: Slack Notification (Failure)
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ WebGL 빌드 실패",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🔥 *${{ github.repository }}* WebGL 빌드 실패\n🚀 빌드 유형: ${{ github.event_name == 'schedule' && '스케줄 빌드 (자동)' || github.event_name == 'workflow_dispatch' && '수동 빌드' || 'Push 빌드' }}\n🌿 브랜치: `${{ github.ref_name }}`\n📝 커밋: ${{ needs.check-changes.outputs.last_commit_message }}\n👤 작성자: ${{ github.actor }}"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🤖 *AI 분석 결과*\n${{ steps.analyze_error.outputs.analysis }}"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|상세 로그 확인>"
                  }
                }
              ]
            }

  deploy:
    name: Butler Push to itch.io
    runs-on: ubuntu-latest
    needs: [check-changes, build]
    if: needs.check-changes.outputs.should_build == 'true' && needs.build.result == 'success'

    steps:
      # 1. 빌드 Artifact 다운로드
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL

      # 2. Butler 직접 설치 및 업로드
      - name: Install and Setup Butler
        run: |
          # Butler 다운로드 (대체 도메인 사용)
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          sudo mv butler /usr/local/bin/
          
          # Butler 버전 확인
          butler -V

      - name: Push to itch.io with Butler
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_IO_API }}
        run: |
          butler push build/WebGL skkupsh/card-factory:html5

      # 3. 배포 실패 시 Gemini 분석
      - name: Analyze Deploy Error with Gemini
        if: failure()
        id: analyze_deploy_error
        run: |
          PROMPT="itch.io Butler 배포(Deploy)가 실패했습니다. 
          Butler CLI를 직접 설치하여 사용하는 방식입니다.
          
          다음 형식으로 답변해주세요:
          
          **원인:**
          (배포 실패의 주요 원인)
          
          **해결방법:**
          1. (구체적인 해결 방법)
          2. (추가 해결 방법)
          3. (추가 해결 방법)"

          JSON_PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              contents: [{
                parts: [{
                  text: $prompt
                }]
              }],
              generationConfig: {
                temperature: 0.7,
                maxOutputTokens: 800
              }
            }')

          # API 호출 (v1 엔드포인트 사용)
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${{ secrets.GEMINI_API }}" \
            -H 'Content-Type: application/json' \
            -d "$JSON_PAYLOAD")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)

          # 디버깅 정보 출력
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Error Response: $HTTP_BODY"
          fi

          if [ "$HTTP_STATUS" = "429" ]; then
            ANALYSIS="⚠️ Gemini API 할당량 초과"
          elif [ "$HTTP_STATUS" = "404" ]; then
            ANALYSIS="⚠️ Gemini API 엔드포인트 오류 (404). API 키를 확인해주세요."
          elif [ "$HTTP_STATUS" = "403" ]; then
            ANALYSIS="⚠️ Gemini API 키가 유효하지 않습니다."
          elif [ "$HTTP_STATUS" != "200" ]; then
            ANALYSIS="⚠️ Gemini API 호출 실패 (HTTP $HTTP_STATUS)"
          else
            ANALYSIS=$(echo "$HTTP_BODY" | jq -r '.candidates[0].content.parts[0].text // "분석 실패"')
          fi
          
          echo "analysis<<EOF" >> $GITHUB_OUTPUT
          echo "$ANALYSIS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 4. 배포 실패 알림 (Gemini 분석 포함)
      - name: Slack Notification (Deploy Failure)
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ itch.io 배포 실패",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚀 *${{ github.repository }}* itch.io 배포 실패\nitch.io 업로드 중 오류가 발생했습니다."
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🤖 *AI 분석 결과*\n${{ steps.analyze_deploy_error.outputs.analysis }}"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|상세 로그 확인>"
                  }
                }
              ]
            }

      # 5. 배포 성공 알림 (itch.io 링크 포함)
      - name: Slack Notification (Deploy Success)
        if: success()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🎮 itch.io 배포 완료",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🎉 *${{ github.repository }}* itch.io 배포 성공\n🌐 <https://skkupsh.itch.io/card-factory|itch.io에서 플레이하기>\n🌿 브랜치: `${{ github.ref_name }}`"
                  }
                }
              ]
            }

      # 6. Artifact 정리
      - name: Cleanup Artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v1
        with:
          name: build-WebGL

  notify-skip:
    name: Notify Build Skipped
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'false'
    steps:
      - name: Slack Notification (Skipped)
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "ℹ️ 스케줄 빌드 스킵",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "ℹ️ *${{ github.repository }}* 스케줄 빌드 스킵\n📅 지난 24시간 동안 main 브랜치에 변경사항이 없습니다."
                  }
                }
              ]
            }