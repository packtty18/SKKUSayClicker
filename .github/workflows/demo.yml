name: Unity WebGL Build & Deploy to itch.io

on:
  push:
    branches: [ web_build ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      last_commit_message: ${{ steps.check.outputs.last_commit_message }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - id: check
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "last_commit_message=${{ github.event.head_commit.message }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          git fetch origin main
          git checkout main
          COMMITS=$(git log --since="24 hours ago" --oneline | wc -l)

          if [ "$COMMITS" -gt 0 ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "last_commit_message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "last_commit_message=No changes" >> $GITHUB_OUTPUT
          fi
  build:
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**','Packages/**','ProjectSettings/**') }}

      - id: unity
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL

      - name: Save Build Log
        if: failure()
        run: |
          find . -name "*.log" | head -1 | xargs tail -n 400 > build_error.log

      - name: Analyze Build Error with Gemini
        if: failure()
        id: gemini
        run: |
          LOG=$(cat build_error.log)

          PROMPT="Unity WebGL 빌드 실패 로그입니다.

          **원인:**
          **해결방법:**

          로그:
          ```
          ${LOG}
          ```"

          JSON=$(jq -n --arg p "$PROMPT" '{contents:[{parts:[{text:$p}]}]}')

          RES=$(curl -s -w "\n%{http_code}" \
            -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${{ secrets.GEMINI_API }}" \
            -H "Content-Type: application/json" -d "$JSON")

          BODY=$(echo "$RES" | sed '$d')
          CODE=$(echo "$RES" | tail -n 1)

          if [ "$CODE" != "200" ]; then
            OUT="Gemini 분석 실패 (HTTP $CODE)"
          else
            OUT=$(echo "$BODY" | jq -r '.candidates[0].content.parts[0].text')
          fi

          echo "analysis<<EOF" >> $GITHUB_OUTPUT
          echo "$OUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: webgl-build
          path: build/WebGL
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webgl-build
          path: build/WebGL

      - name: Butler Push
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.ITCH_IO_API }}
          ITCH_USER: skkupsh
          ITCH_GAME: card-factory
          CHANNEL: html5
          PACKAGE: build/WebGL

      - name: Slack Success
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "🎮 WebGL 빌드 & itch.io 배포 성공",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*빌드 & 배포 완료*\n• 브랜치: main\n• 커밋: ${{ github.sha }}"
                }
              }]
            }
  notify-failure:
    needs: build
    if: needs.build.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Slack Failure
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ WebGL 빌드 실패",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Gemini 분석 결과*\n${{ needs.build.outputs.analysis }}"
                }
              }]
            }
