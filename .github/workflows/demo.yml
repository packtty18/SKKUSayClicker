name: Unity WebGL Build & Deploy

on:
  push:
    branches: [ web_build ]
  schedule:
    - cron: "0 0 * * *" # 매일 UTC 0시 = 한국시간 오전 9시
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      last_commit_message: ${{ steps.check.outputs.last_commit_message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if build is needed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "last_commit_message=${{ github.event.head_commit.message || 'Manual build' }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          git fetch origin main
          git checkout main
          COMMITS_LAST_24H=$(git log --since="24 hours ago" --oneline | wc -l)
          LAST_COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          
          if [ $COMMITS_LAST_24H -gt 0 ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "last_commit_message=$LAST_COMMIT_MSG" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "last_commit_message=No changes" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Get Previous Successful Build Commit
        id: previous_commit
        run: |
          PREVIOUS_COMMIT=$(git log --pretty=format:"%H" --skip=1 -n 20 | while read commit; do
            STATUS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${commit}/status" | \
              jq -r '.state')
            if [ "$STATUS" = "success" ]; then
              echo "$commit"
              break
            fi
          done)
          if [ -z "$PREVIOUS_COMMIT" ]; then
            PREVIOUS_COMMIT=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          echo "previous_sha=$PREVIOUS_COMMIT" >> $GITHUB_OUTPUT

      - name: Generate Commit History
        id: commits
        run: |
          PREVIOUS_SHA="${{ steps.previous_commit.outputs.previous_sha }}"
          CURRENT_SHA="${{ github.sha }}"
          COMMITS=$(git log --pretty=format:"• %s (%an)" ${PREVIOUS_SHA}..${CURRENT_SHA} | head -n 10)
          
          echo "commit_list<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          COMMIT_COUNT=$(git rev-list --count ${PREVIOUS_SHA}..${CURRENT_SHA})
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        id: unity_build
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildProfile: "Assets/Settings/Build Profiles/Web-Mobile-Development.asset"

      - name: Save Build Log
        if: failure()
        run: |
          LOG_FILE=$(find /home/runner/work -name "*.log" -type f | grep -i unity | head -1)
          if [ -n "$LOG_FILE" ]; then
            tail -c 20000 "$LOG_FILE" > build_error.log
          else
            echo "Build failed but log file not accessible" > build_error.log
          fi

      - name: Set up Node for Analysis
        if: failure()
        uses: actions/setup-node@v4
        with: 
          node-version: '20'

      - name: Install GoogleGenerativeAI
        if: failure()
        run: npm install @google/generative-ai

      # --- [수정됨] 빌드 에러 분석 및 파일 저장 ---
      - name: Analyze Build Error with Gemini
        if: failure()
        id: analyze_error
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API }}
        with:
          script: |
            const fs = require("fs");
            const { GoogleGenerativeAI } = require("@google/generative-ai");

            let logContent = "Log file not found.";
            if (fs.existsSync("build_error.log")) 
            {
              logContent = fs.readFileSync("build_error.log", "utf8");
            }

            const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
            const model = genAI.getGenerativeModel({ model:"gemini-1.5-flash" });

            const prompt = `
            다음은 Unity WebGL 빌드 실패 로그의 마지막 부분입니다. 
            한국어로 **원인**과 **해결방법**을 요약해 주세요.
            로그:
            \`\`\`
            ${logContent}
            \`\`\`
            `;

            try {
              console.log("🚀 Requesting Gemini API...");
              const result = await model.generateContent(prompt);
              const response = await result.response;
              const text = response.text();
              
              // 1. 응답 검증 로그
              if (text && text.length > 0) {
                console.log(`✅ Gemini Response Received (${text.length} chars)`);
              } else {
                console.warn("⚠️ Gemini Response is empty!");
              }

              // 2. 결과를 txt 파일로 저장 (아티팩트용)
              fs.writeFileSync("gemini_build_analysis.txt", text);
              console.log("💾 Saved analysis to gemini_build_analysis.txt");

              // 3. Slack용 JSON 처리
              const safeText = JSON.stringify(text).slice(1, -1);
              core.setOutput("analysis", safeText);

            } catch (error) {
              console.error("❌ Gemini API Error:", error);
              fs.writeFileSync("gemini_build_analysis.txt", "Error analyzing log:" + error.message);
              core.setOutput("analysis", "⚠️ 분석 중 오류 발생:" + error.message);
            }

      # --- [추가됨] 빌드 분석 결과 아티팩트 업로드 ---
      - name: Upload Gemini Analysis Artifact (Build)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-build-analysis-result
          path: gemini_build_analysis.txt

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Slack Notification (Success)
        if: success()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ WebGL 빌드 성공",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *${{ github.repository }}* WebGL 빌드 완료\n🚀 유형: ${{ github.event_name }}\n🌿 브랜치: `${{ github.ref_name }}`\n👤 작성자: ${{ github.actor }}\n🌐 <${{ steps.deployment.outputs.page_url }}|GitHub Pages 플레이>"
                  }
                },
                { "type": "divider" },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "📝 *변경사항* (${{ steps.commits.outputs.commit_count }}개 커밋)\n${{ steps.commits.outputs.commit_list }}"
                  }
                }
              ]
            }

      - name: Slack Notification (Failure)
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ WebGL 빌드 실패",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🔥 *${{ github.repository }}* WebGL 빌드 실패\n🚀 유형: ${{ github.event_name }}\n🌿 브랜치: `${{ github.ref_name }}`\n👤 작성자: ${{ github.actor }}"
                  }
                },
                { "type": "divider" },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🤖 *AI 분석 결과*\n${{ steps.analyze_error.outputs.analysis }}"
                  }
                },
                { "type": "divider" },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|상세 로그 확인>"
                  }
                }
              ]
            }

  deploy:
    name: Butler Push to itch.io
    runs-on: ubuntu-latest
    needs: [check-changes, build]
    if: needs.check-changes.outputs.should_build == 'true' && needs.build.result == 'success'

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL

      - name: Install and Setup Butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          sudo mv butler /usr/local/bin/
          butler -V

      - name: Push to itch.io with Butler
        id: butler_push
        continue-on-error: true
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_IO_API }}
        run: |
          butler push build/WebGL skkupsh/card-factory:html5 2>&1 | tee butler_output.log
          
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Butler exit code: $EXIT_CODE"
          
          if [ $EXIT_CODE -ne 0 ]; then
            cp butler_output.log deploy_error.log
            exit $EXIT_CODE
          fi

      - name: Set up Node for Deploy Analysis
        if: failure()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install GoogleGenerativeAI
        if: failure()
        run: npm install @google/generative-ai

      # --- [수정됨] 배포 에러 분석 및 파일 저장 ---
      - name: Analyze Deploy Error with Gemini
        if: failure()
        id: analyze_deploy_error
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API }}
        with:
          script: |
            const fs = require("fs");
            const { GoogleGenerativeAI } = require("@google/generative-ai");

            let logContent = "Deploy error log not found.";
            if (fs.existsSync("deploy_error.log")) {
              logContent = fs.readFileSync("deploy_error.log", "utf8");
            }

            const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
            const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

            const prompt = `
            다음은 itch.io Butler 배포 실패 로그입니다. 한국어로 해결법을 알려주세요.
            로그: \`\`\`${logContent}\`\`\`
            `;

            try {
              console.log("🚀 Requesting Gemini API (Deploy)...");
              const result = await model.generateContent(prompt);
              const response = await result.response;
              const text = response.text();
              
              // 1. 응답 검증
              if (text && text.length > 0) {
                console.log(`✅ Gemini Response Received (${text.length} chars)`);
              } else {
                console.warn("⚠️ Gemini Response is empty!");
              }

              // 2. 파일 저장
              fs.writeFileSync("gemini_deploy_analysis.txt", text);
              console.log("💾 Saved analysis to gemini_deploy_analysis.txt");

              // 3. Slack용 JSON 처리
              const safeText = JSON.stringify(text).slice(1, -1);
              core.setOutput("analysis", safeText);

            } catch (error) {
              console.error("❌ Gemini API Error:", error);
              fs.writeFileSync("gemini_deploy_analysis.txt", "Error:" + error.message);
              core.setOutput("analysis", "⚠️ 분석 실패:" + error.message);
            }

      # --- [추가됨] 배포 분석 결과 아티팩트 업로드 ---
      - name: Upload Gemini Analysis Artifact (Deploy)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-deploy-analysis-result
          path: gemini_deploy_analysis.txt

      - name: Slack Notification (Deploy Failure)
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ itch.io 배포 실패",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚀 *${{ github.repository }}* itch.io 배포 실패"
                  }
                },
                { "type": "divider" },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🤖 *AI 분석 결과*\n${{ steps.analyze_deploy_error.outputs.analysis }}"
                  }
                },
                { "type": "divider" },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|상세 로그 확인>"
                  }
                }
              ]
            }

      - name: Slack Notification (Deploy Success)
        if: success()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🎮 itch.io 배포 완료",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🎉 *${{ github.repository }}* itch.io 배포 성공\n🌐 <https://skkupsh.itch.io/card-factory|itch.io에서 플레이하기>\n🌿 브랜치: `${{ github.ref_name }}`"
                  }
                }
              ]
            }

      - name: Cleanup Artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v1
        with:
          name: build-WebGL

  notify-skip:
    name: Notify Build Skipped
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'false'
    steps:
      - name: Slack Notification (Skipped)
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "ℹ️ 스케줄 빌드 스킵",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "ℹ️ *${{ github.repository }}* 스케줄 빌드 스킵\n📅 지난 24시간 동안 main 브랜치에 변경사항이 없습니다."
                  }
                }
              ]
            }