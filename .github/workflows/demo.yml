name: Unity WebGL Build & Deploy

on:
  push:
    branches: [ web_build ]
  schedule:
    - cron: "0 0 * * *" # 매일 UTC 0시 = 한국시간 오전 9시
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      last_commit_message: ${{ steps.check.outputs.last_commit_message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if build is needed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "last_commit_message=${{ github.event.head_commit.message }}" >> $GITHUB_OUTPUT
            echo "✅ Push event - build triggered"
            exit 0
          fi
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "last_commit_message=Manual build triggered" >> $GITHUB_OUTPUT
            echo "✅ Manual trigger - build triggered"
            exit 0
          fi
          
          git fetch origin main
          git checkout main
          
          COMMITS_LAST_24H=$(git log --since="24 hours ago" --oneline | wc -l)
          LAST_COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          
          if [ $COMMITS_LAST_24H -gt 0 ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "last_commit_message=$LAST_COMMIT_MSG" >> $GITHUB_OUTPUT
            echo "✅ Found $COMMITS_LAST_24H commits in last 24 hours"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "last_commit_message=No changes" >> $GITHUB_OUTPUT
            echo "ℹ️ No commits in last 24 hours"
          fi

  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Generate Commit History
        id: commits
        run: |
          COMMITS=$(git log -5 --pretty=format:"• %s (%an)")
          echo "commit_list<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        id: unity_build
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildProfile: "Assets/Settings/Build Profiles/Web-Mobile-Development.asset"

      - name: Save Build Log
        if: failure() || steps.unity_build.outcome == 'failure'
        id: save_log
        run: |
          LOG_FILE=$(find /home/runner/work -name "*.log" -type f 2>/dev/null | grep -i unity | head -1)
          
          if [ -n "$LOG_FILE" ]; then
            echo "Found log file: $LOG_FILE"
            grep -iE "error|exception|fail|failed|fatal" "$LOG_FILE" > build_error.log || true
            
            if [ ! -s build_error.log ]; then
              echo "⚠️ No explicit error keywords found. Tailing last 100 lines..."
              tail -n 100 "$LOG_FILE" > build_error.log
            fi
            echo "log_saved=true" >> $GITHUB_OUTPUT
          else
            echo "Build failed but log file not accessible" > build_error.log
            echo "log_saved=false" >> $GITHUB_OUTPUT
          fi

      # --- [수정됨] 모델: gemini-2.5-flash-lite ---
      - name: Analyze Build Error with Gemini
        if: failure() || steps.unity_build.outcome == 'failure'
        id: analyze_error
        run: |
          if [ -f "build_error.log" ]; then
            LOG_CONTENT=$(cat build_error.log | head -c 30000)
          else
            LOG_CONTENT="Log file not found."
          fi
          
          JSON_PAYLOAD=$(jq -n \
            --arg log "$LOG_CONTENT" \
            '{
              contents: [{
                parts: [{
                  text: ("Unity WebGL 빌드 실패 로그입니다. 원인과 해결방법을 한국어로 3줄 요약해주세요:\n\n" + $log)
                }]
              }],
              generationConfig: { temperature: 0.7, maxOutputTokens: 500 }
            }')
          
          # 모델 변경: gemini-2.5-flash-lite
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${{ secrets.GEMINI_API }}" \
            -H 'Content-Type: application/json' \
            -d "$JSON_PAYLOAD")
          
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            ANALYSIS=$(echo "$HTTP_BODY" | jq -r '.candidates[0].content.parts[0].text // "분석 실패"')
          else
            ANALYSIS="⚠️ Gemini API 오류 (HTTP $HTTP_STATUS)"
          fi
          
          echo "analysis<<EOF" >> $GITHUB_OUTPUT
          echo "$ANALYSIS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload Build Artifact
        if: steps.unity_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL

      - name: Setup Pages
        if: steps.unity_build.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: steps.unity_build.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

      - name: Deploy to GitHub Pages
        if: steps.unity_build.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Slack Notification (Success)
        if: steps.unity_build.outcome == 'success'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ WebGL 빌드 성공",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *${{ github.repository }}* 빌드 성공\n🌐 <${{ steps.deployment.outputs.page_url }}|GitHub Pages 플레이>"
                  }
                }
              ]
            }

      - name: Slack Notification (Failure)
        if: steps.unity_build.outcome == 'failure'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ WebGL 빌드 실패",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🔥 *${{ github.repository }}* 빌드 실패\n로그 확인이 필요합니다."
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format('*🤖 AI 분석 (2.5 Flash Lite):*\n{0}', steps.analyze_error.outputs.analysis)) }}
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|로그 보러가기>"
                    }
                  ]
                }
              ]
            }
        
      - name: Fail Job if Build Failed
        if: steps.unity_build.outcome == 'failure'
        run: exit 1

  deploy:
    name: Butler Push to itch.io
    runs-on: ubuntu-latest
    needs: [check-changes, build]
    if: needs.check-changes.outputs.should_build == 'true' && needs.build.result == 'success'

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL

      - name: Butler Push
        id: butler_push
        uses: itchio/butler-action@v1.0.3
        with:
          api-key: ${{ secrets.ITCH_IO_API }}
          user: skkupsh
          game: card-factory
          channel: html5
          version: ${{ github.run_number }}
          directory: build/WebGL

      # --- [수정됨] 모델: gemini-2.5-flash-lite ---
      - name: Analyze Deploy Error with Gemini
        if: failure()
        id: analyze_deploy_error
        run: |
          PROMPT="itch.io Butler 배포 실패. 원인과 해결책 3가지를 한국어로 요약."
          
          JSON_PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              contents: [{ parts: [{ text: $prompt }] }],
              generationConfig: { temperature: 0.7, maxOutputTokens: 300 }
            }')

          # 모델 변경: gemini-2.5-flash-lite
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${{ secrets.GEMINI_API }}" \
            -H 'Content-Type: application/json' \
            -d "$JSON_PAYLOAD")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)

          if [ "$HTTP_STATUS" -eq 200 ]; then
            ANALYSIS=$(echo "$HTTP_BODY" | jq -r '.candidates[0].content.parts[0].text // "분석 실패"')
          else
            ANALYSIS="⚠️ Gemini API 오류 (HTTP $HTTP_STATUS)"
          fi
          
          echo "analysis<<EOF" >> $GITHUB_OUTPUT
          echo "$ANALYSIS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Slack Notification (Deploy Failure)
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ itch.io 배포 실패",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚀 *배포 실패*\nitch.io 업로드 중 오류가 발생했습니다."
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format('*🤖 AI 가이드 (2.5 Flash Lite):*\n{0}', steps.analyze_deploy_error.outputs.analysis)) }}
                  }
                }
              ]
            }

      - name: Slack Notification (Deploy Success)
        if: success()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🎮 itch.io 배포 완료",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🎉 *itch.io 배포 성공*\n🌐 <https://skkupsh.itch.io/card-factory|플레이하기>"
                  }
                }
              ]
            }

      - name: Cleanup Artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v1
        with:
          name: build-WebGL

  notify-skip:
    name: Notify Build Skipped
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'false'
    steps:
      - name: Slack Notification (Skipped)
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "ℹ️ 스케줄 빌드 스킵",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "ℹ️ *${{ github.repository }}* 빌드 스킵 (변경사항 없음)"
                  }
                }
              ]
            }